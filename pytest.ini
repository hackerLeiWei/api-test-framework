[pytest]
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir
markers =
    smoke: 冒烟用例，版本准入门禁，必须在 5 分钟内跑完
    e2e: 端到端业务链路用例
    p0: 故障代价最高的核心功能
    reconcile: 跨系统数据对账
    mes: MES 系统
    erp: ERP 系统
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
